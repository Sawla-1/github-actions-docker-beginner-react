name: Build and Test Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sanity-check the React app builds BEFORE we bother with Docker
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      # Now do the same build, but inside Docker
      - name: Build Docker image
        run docker build -t my-react-site:test .

      - name: Run container
        run: docker run -d -p 8080:80 --name my-react-site-test my-react-site:test

      - name: Check site responds
        run: |
          sleep 2
          curl --fail http://localhost:8080

      - name: Stop container
        if: always()
        run: docker rm -f my-react-site-test
